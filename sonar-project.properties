sonar.projectKey=Steven01231_SOEN345-Winter2026
sonar.organization=soen345-winter
sonar.projectName=SOEN345-Winter2026
sonar.projectVersion=1.0

# Sources & tests
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java,app/src/androidTest/java

# Compiled classes — use wildcard to work with any AGP version
sonar.java.binaries=app/build/**/classes

# Coverage report (generated by JaCoCo step before this runs)
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Exclusions
sonar.exclusions=**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*
sonar.coverage.exclusions=**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*,**/androidTest/**,**/*EspressoTest*,**/*Activity*,**/ui/theme/**

sonar.sourceEncoding=UTF-8
